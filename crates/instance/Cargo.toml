[package]
name = "app-instance"
description = "One running copy per app: a second launch brings the first copy's window to the front and exits"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
tracing.workspace = true
# Win32_Security gates CreateMutexW, CreateEventW and the token query,
# Win32_Security_Authorization the SDDL conversions that let normal and elevated
# copies share the objects, and Win32_System_Threading the waits on them.
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[lints]
workspace = true
